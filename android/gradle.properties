# Heap enxuto e compilador Kotlin no mesmo processo do Gradle: o build roda no Windows ao lado da
# VM do WSL e do Docker, e com -Xmx2g a JVM chegou a cair por falta de memória (24/11/2026).
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.workers.max=2
# Sem daemon persistente: ocioso ele segurava ~1 GB por horas e o próximo build não abria.
org.gradle.daemon=false
