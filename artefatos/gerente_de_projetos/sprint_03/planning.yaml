meta:
  versao: 1
  criado_em: "2026-06-15"
  criado_por: "[gerente]"
  status: esqueleto
  # esqueleto = gerente preencheu ordem/grupos/estimativas; implementador ainda não analisou
  # em_analise = implementador preenchendo analise por task
  # pronto = planning fechado para execução
