    branch_sugerida: feature/refactor-atendimento-python
    tasks: [T-A2]
    estimativa_grupo: L

  - id: G4
    assunto: "Backend — domínio atendimento (timestamp + criação automática)"
    branch_sugerida: null
    nota: "T-A3 e T-A4 em branches separadas (escopo distinto); mesmo assunto de domínio."
    tasks: [T-A3, T-A4]
    estimativa_grupo: M

  - id: G5
