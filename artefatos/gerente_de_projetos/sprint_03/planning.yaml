    - artefatos/gerente_de_projetos/backlog_req016_atendimentos.md
    - scripts/criar_issues_req016_sprint03.ps1

# Sequência de implementação (ordem global). Tasks no mesmo `ordem` podem rodar em paralelo.
ordem_implementacao:
  - ordem: 1
    grupo: G1
    nota: "Migration mecânica — baixo risco; base para todo o restante."
  - ordem: 2
    grupo: G2
    nota: "Migration semântica — risco médio; PR separado de G1."
  - ordem: 3
    grupo: G3
    nota: "Refactor transversal; desbloqueia backend e frontend."
  - ordem: 4
    grupos: [G4, G5, G7]
    nota: "Três frentes em paralelo após G3 (T-A3, T-A4, T-A8, T-A11)."

# Agrupamento temático + sugestão de branch. Nem todo grupo vira uma única branch — ver `tasks`.
