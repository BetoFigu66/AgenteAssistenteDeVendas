# Sprint 03 — Planning (fonte única do planejamento técnico)
# Gerado no dia 1 do sprint pelo [gerente]. Análise detalhada task a task: [implementador].
# Issues GitHub: milestone "Sprint 03" (REQ-016). Sincronizar campo `issue` quando tiver o número.
# Backlog detalhado: artefatos/gerente_de_projetos/backlog_req016_atendimentos.md

