analise_implementador:
  data: "2026-06-17"
  abordagem: |
    T-A3 concluída: coluna ultima_mensagem_at em atendimentos, backfill via MAX(mensagens.timestamp)
    where origem=user, atualização em processador._atualizar_ultima_mensagem_at ao vincular msg do cliente.
    Campo exposto em GET /api/atendimentos/ativas e to_dict().

    T-A4 — extrair e evoluir lógica hoje inline no processador:
    - Criar backend/services/atendimentos.py com obter_ou_criar_atendimento_para_mensagem(db, contato, ...).
    - Migration NOVA: adicionar coluna numero_atendimento_cliente (Integer, NOT NULL após backfill)
      com UNIQUE (contato_id, numero_atendimento_cliente). Gap: T-A1 não renomeou essa coluna porque
      ela ainda não existia no POC — confirmar no psql antes de autogenerate.
    - Numeração: SELECT COALESCE(MAX(numero_atendimento_cliente),0)+1 ... FOR UPDATE no contato
      (ou lock advisory por contato_id) para evitar race em webhooks concorrentes.
    - Regras v1 (sem T-A5/T-A7): contato novo → ativo #1; contato com ativo → reutiliza;
      só encerrados → criar novo #N+1 (placeholder T-A5: pergunta continuação fica Sprint 04).
    - Substituir _obter_ou_criar_atendimento e _obter_ou_criar_atendimento_pf_pendente no processador
      por chamadas ao serviço (manter métodos privados como thin wrapper se reduzir diff).
    - API listagem: incluir numero_atendimento_cliente para badge "Atendimento #N" na F01/F02.

    T-A8 — parâmetro runtime:
    - Migration seed: INSERT parametros (janela_continuacao_atendimento_horas, 24, descricao).
    - Validacao int >= 1 na escrita (PATCH admin ou seed).
    - Expor em GET /api/config/rag ou novo GET /api/config/atendimento (preferir endpoint dedicado
      ou estender resposta existente sem quebrar frontend RAG).
    - ParametroService.get_int sem cache longo — cache por sessão OK (D02); invalidar cache após PATCH.
    - Consumo efetivo do parâmetro fica para T-A5 (Sprint 04); nesta entrega basta persistir + ler + expor.
  criterios_pronto:
    - "Migration T-A4 head OK; backfill numero=1 para atendimentos existentes por contato (ordem created_at)"
    - "Dois POST simultâneos simulados não geram mesmo numero_atendimento_cliente"
