analise_implementador:
  data: "2026-06-15"
  abordagem: |
    Migration Alembic pura com op.rename_table e op.alter_column(..., new_column_name=...).
    PostgreSQL preserva FKs ao renomear tabela referenciada; índices renomeados via ALTER INDEX.
    Ordem: tabelas pai primeiro, depois colunas FK nas filhas, depois índices.
  riscos:
    - "App quebra até T-A2 alinhar models.py — esperado neste PR."
    - "Downgrade deve reverter na ordem inversa."
    - "Com models.py ainda em 'negociacoes', o app pode recriar tabelas vazias órfãs no startup — merge T-A2 logo após."
  criterios_pronto:
    - "alembic upgrade head OK"
    - "alembic downgrade -1 OK"
    - "Contagem de linhas inalterada em atendimentos vs negociacoes anterior"

implementacao:
  migration: backend/alembic/versions/2026061501_rename_negociacoes_atendimentos.py
  commit_sugerido: "feat(REQ-016): migration de rename negociacoes -> atendimentos"

