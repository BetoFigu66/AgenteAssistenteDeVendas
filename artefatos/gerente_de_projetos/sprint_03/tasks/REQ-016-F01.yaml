analise_implementador:
  data: "2026-06-17"
  abordagem: |
    Backend e migrations (T-A1, T-A1b, T-A2) estão concluídos: tabelas atendimentos/atendimento_infos,
    StatusAtendimento ATIVO/ENCERRADO, rotas /api/atendimentos/*, processador usando Atendimento.
    Migration 2026061503 aplicou timestamptz UTC (apoio ao bug #2, fora do escopo direto desta entrega).

    Restante da entrega = T-A11 (frontend cosmético + consistência):
    1. Renomear estado interno em AcompanhamentoPage.jsx (negociacoes → atendimentos, etc.).
    2. Labels visíveis: lista lateral, headers, comentários de código expostos ao usuário.
    3. Badge "Atendimento #N" no cabecalho da conversa (ConversaInfo) e na lista de ativos —
       hoje ConversaInfo usa atendimento.id; numero_atendimento_cliente vem na F02 (#77).
       Até F02: exibir "Atendimento #id" ou placeholder até API expor numero_atendimento_cliente.
    4. Manter aliases deprecated em api.js (listarNegociacoesAtivas) até grep limpo, depois remover.
    5. Compatibilidade: ConversaInfo e ProcessamentoDetalhes já leem atendimento ?? negociacao legado.

    Rotas /negociacoes/* → /atendimentos/*: o App.jsx usa estado local (pagina), não react-router.
    Não há URLs /negociacoes hoje. Critério prático: nomenclatura e componentes; deep links ficam fora.
  criterios_pronto:
    - "grep -ri Negocia frontend/src --include='*.jsx' --include='*.js' sem matches em strings visíveis ao usuário"
    - "AcompanhamentoPage renderiza sem erro; listarAtendimentosAtivos OK"
    - "ConversaInfo e AtendimentoDetalhes exibem Atendimento #N (id ou numero_atendimento_cliente)"
    - "pytest backend/tests passa (regressão backend)"
    - "Fechar issue #76 no GitHub com checklist T-A11 marcada"
  riscos:
    - "Badge #N depende parcialmente de F02 (numero_atendimento_cliente ainda não existe no schema Python)."
    - "Container frontend :3000 precisa rebuild se não usar volume bind mount."
    - "Renomear variáveis em AcompanhamentoPage é diff grande mas mecânico — risco baixo de regressão lógica."

