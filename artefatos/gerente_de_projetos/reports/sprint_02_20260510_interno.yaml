feito:
  - titulo: "Página Cockpit de Acompanhamento de Conversas"
    agente: "Implementador / Beto"
    descricao: >
      Componente AcompanhamentoPage.jsx com listagem de negociações ativas, filtro por usuário,
      visualização do histórico de mensagens, aprovação/reprovação de mensagens pendentes,
      envio manual de mensagem pelo operador, modal de raciocínio do cérebro (processamento).
      Cobre o item planejado no Sprint 1.

  - titulo: "Sistema RAG — Busca por Chunks de Produto"
    agente: "Implementador / Beto"
    descricao: >
      Pipeline completo: webscraping + geração de chunks (gerar_chunks_rag.py), ingestão com
      embedding OpenAI (ingerir_conhecimento_rag.py), busca semântica via pgvector (RetrievalService).
      Scripts auxiliares: consolidar_conhecimento_rag.py, inventariar_fontes_rag.py,
      preprocessar_conhecimento_rag.py, buscar_rag.py (CLI de teste). Cobre parcialmente REQ-003.

  - titulo: "Sistema Q&A Pairs — Camada Curada sobre o RAG"
    agente: "Implementador / Beto"
    descricao: >
      Implementação completa dos 9 passos do plano_qa_pairs_v1.md:
      Ajustes no DB; criação de Q&A inicial baseada nos folders de produtos.

  - titulo: "Embedding Provider OpenAI com factory pattern"
    agente: "Implementador / Beto"
    descricao: >
      Abstração EmbeddingProvider (base.py), implementação OpenAIEmbeddingProvider
      (openai_provider.py) e factory configurável via variável EMBEDDING_PROVIDER.
      Arquitetura preparada para troca de provider (ex: Ollama futuro) sem alterar código cliente.

  - titulo: "Configuração dinâmica do RAG via API"
    agente: "Implementador / Beto"
    descricao: >
      Endpoint GET/PATCH /api/config/rag para controle em tempo real de RAG_ENABLED,
      QA_ENABLED, QA_SCORE_MINIMO, RAG_SCORE_MINIMO sem restart do backend.
      Persistência em memória (volátil por sessão).

  - titulo: "Modal de Reprovação com criação de rascunho Q&A"
    agente: "Implementador / Beto"
    descricao: >
      Extensão do modal Reprovar em AcompanhamentoPage: seção opcional para criar novo par Q&A
      a partir da mensagem reprovada. Pergunta pré-preenchida com a mensagem anterior do cliente
      (editável), select de contexto, campo resposta correta. Antes de salvar, verifica pares
      pendentes similares e exige confirmação (anti-duplicata). Par criado como rascunho
      (ativo=true, aprovado=false) para revisão na Base Q&A.

  - titulo: "Bug fix — mensagem reprovada permanecia pendente na UI"
    agente: "Implementador / Beto"
    descricao: >
      Correção no endpoint POST /api/mensagens/{id}/reprovar: setava comentário mas não preenchia
      aprovador_id e timestamp_aprovacao. A propriedade pendente_aprovacao (calculada) dependia
      de aprovador_id=None para mensagens de origem system, fazendo a mensagem permanecer
      pendente indefinidamente após reprovação.

  - titulo: "Diretriz D05 — Rotas estáticas antes de dinâmicas no FastAPI"
    agente: "QA Engineer / Implementador"
    descricao: >
      Registrada após bug 422 em /api/negociacoes/ativas causado por rota dinâmica /{id}
      declarada antes da rota estática /ativas. Diretriz adicionada ao harness em diretrizes.md.

  - titulo: "Diretriz D06 — Checks de QA executáveis via @registrar_check"
    agente: "QA Engineer"
    descricao: >
      Formalização da arquitetura de checks executáveis: registry global com decorator
      @registrar_check, severidades (error/warning/info), escopos (sempre/pre-commit/release).
      Script scripts/qa_check.py + integração pre-commit. Diretrizes D05 e D06 adicionadas ao harness.

  - titulo: "Análise estratégica — Agentes vs Skills vs Harness"
    agente: "Arquiteto de Sistemas"
    descricao: >
      Documento analise_agentes_vs_skills_vs_harness.md avaliando as três abordagens
      de governança de IA para desenvolvimento. Conclusão: harness (AGENTS.md + diretrizes.md)
      é o mecanismo mais efetivo; skills executáveis têm melhor ROI; classes Python de agentes
      são subutilizadas frente ao custo de manutenção.

  - titulo: "Gerador de artefatos de sprint report V01"
    agente: "Gerente de Projetos"
    descricao: >
      Gera artefatos de sprint report a partir de yaml com dados da Sprint, que por sua vez são gerados automaticamente pelo agente gerente de projeto.

