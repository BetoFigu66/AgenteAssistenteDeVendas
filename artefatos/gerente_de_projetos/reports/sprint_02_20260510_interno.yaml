insights:
  - "Velocidade: Sprint com alta entrega técnica (sistema Q&A Pairs completo em 1 sprint). O plano de 9 passos
     foi executado integralmente, porém com extensão de tempo (1 semana)."
  - "Dívida de planejamento: três itens prioritários do Sprint 1 (REQ-002, REQ-004, REQ-007) migraram para
     o Sprint 2 e novamente para o Sprint 3. Risco de acumulação. Recomendado comprometer no mínimo REQ-002
     e REQ-004 no Sprint 3 antes de iniciar novas features."
  - "Qualidade: bug de reprovação revelou fragilidade no estado derivado (propriedade calculada pendente_aprovacao).
     Considerar adicionar check de QA para estados calculados críticos."
  - "Governança de IA: análise Agentes vs Skills vs Harness gerou insumo para simplificação do diretório agentes/.
     Recomendado executar a simplificação no Sprint 3 (baixa prioridade, mas reduz dívida de manutenção)."
  - "Embedding lazy (gerado na aprovação, não no cadastro): decisão correta — elimina custo de API para rascunhos que nunca serão aprovados e reduz latência do POST /api/pares-qa."
