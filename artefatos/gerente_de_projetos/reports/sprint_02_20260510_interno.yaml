# Cada item lista o(s) REQ(s) que toca e o avanço (antes/depois/delta_pp) na cobertura
# global daquele REQ. "delta_pp" = pontos percentuais de avanço atribuídos a esta entrega
# (quando uma entrega divide crédito com outras do mesmo REQ na mesma sprint, distribuímos
# o delta total do REQ entre elas — ver bloco cobertura_sprint para o consolidado).
# Fonte do "depois": artefatos/gerente_de_projetos/cobertura_reqs_sprint02.md §1.1.
# Itens de processo/governança (sem REQ) usam req: ["—"].
feito:
  - titulo: "Página Cockpit de Acompanhamento de Conversas"
    req: ["REQ-010", "REQ-011"]
    cobertura_req:
      REQ-010: { antes: "~10%", depois: "~30%", delta_pp: "+20" }
      REQ-011: { antes: "~0%", depois: "~10%", delta_pp: "+10" }

 
  - titulo: "Sistema RAG — Busca por Chunks de Produto"
    req: ["REQ-003"]
    cobertura_req:
      REQ-003: { antes: "~5%", depois: "~60%", delta_pp: "+55" }

  - titulo: "Sistema Q&A Pairs — Camada Curada sobre o RAG"
    req: ["REQ-013"]
    cobertura_req:
      REQ-013: { antes: "0%", depois: "~60%", delta_pp: "+60" }  # parcial; modal completa para 70%

  - titulo: "Embedding Provider OpenAI com factory pattern"
    req: ["REQ-003", "REQ-013"]
    cobertura_req: { obs: "infra de suporte — habilita REQ-003 e REQ-013; delta atribuído aos itens funcionais acima" }

  - titulo: "Configuração dinâmica do RAG via API"
    req: ["REQ-014"]
