# Riscos e impedimentos abertos.
# Cada item: { nome, tipo: alta|media|baixa, motivo, acao_esperada }.
# Convenção de severidade:
#   - alta  (🔴): trava ou ameaça travar um marco crítico (ex: deploy). Exige decisão.
#   - media (🟡): não trava agora, mas bloqueará trabalho próximo se não for endereçado.
#   - baixa (🟢): risco residual; monitorar, não exige ação imediata.
riscos_e_impedimentos:
  - nome: "Provedor LLM para produção"
    tipo: "🟡 media"
    motivo: >
      Groq (atual) tem rate limits e OpenAI tem custo elevado para volume real.
      Como o desenvolvimento foi reorientado para modo de simulação (integração
      WhatsApp Business adiada), a urgência caiu: não bloqueia mais a sprint
      atual. Continua sendo decisão necessária antes de qualquer deploy real.
    acao_esperada: >
      Manter monitorado. ADR conjunto do [arquiteto] (técnico) e [planejador]
      (custo) deve ser produzido até a sprint que reativar a integração real
      (REQ-008). Considerar estratégia híbrida: Groq para classificação leve
      + OpenAI para geração.

  - nome: "Webhook WhatsApp/Twilio em dev"
    tipo: "🟢 baixa"
    motivo: >
      Integração real com Twilio (URL pública HTTPS via ngrok, validação no
      sandbox, número aprovado, templates pré-aprovados) é pré-requisito
      conhecido para REQ-008. Como REQ-008 foi adiado e o desenvolvimento
      atual usa modo de simulação, o risco virou residual: monitorar e
      reavaliar quando a integração real voltar ao plano.
    acao_esperada: >
      Reabrir como 🟡 media na sprint que reincluir REQ-008 no escopo.
      Quando isso acontecer, documentar procedimento de setup ngrok e
      checklist de validação no sandbox Twilio antes de começar.

  - nome: "Seed Q&A com aprovado=false"
    tipo: "🟡 media"
    motivo: >
      O seed inicial de pares Q&A entrou no DB como rascunhos (ativo=true,
      aprovado=false). Pela lógica do RAG, pares não-aprovados não são usados
      pelo agente. Sistema funciona tecnicamente, mas o ganho da camada Q&A só
      aparece após revisão humana — sem isso, o agente cai no RAG genérico.
    acao_esperada: >
      Agendar sessão de revisão com domain expert (Rita/Inforrel) usando a
      QABasePage. Pode entrar como tarefa do Sprint 3.

