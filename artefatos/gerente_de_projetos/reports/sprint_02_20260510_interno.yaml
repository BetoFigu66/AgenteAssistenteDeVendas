      REQ-014: { antes: "0%", depois: "~25%", delta_pp: "+25" }

  - titulo: "Modal de Reprovação com criação de rascunho Q&A"
    req: ["REQ-011", "REQ-013"]
    cobertura_req:
      REQ-011: { antes: "~10%", depois: "~20%", delta_pp: "+10" }
      REQ-013: { antes: "~60%", depois: "~70%", delta_pp: "+10" }

  - titulo: "Bug fix — mensagem reprovada permanecia pendente na UI"
    req: ["REQ-011"]
    cobertura_req:
      REQ-011: { antes: "~20%", depois: "~25%", delta_pp: "+5" }  # estabilização do workflow já contado


# Camada 2 — Resumo agregado da sprint (delta total por REQ + média do projeto).
