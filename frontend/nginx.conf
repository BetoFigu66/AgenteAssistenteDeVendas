server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA - redireciona todas as rotas para index.html
    # no-cache: o navegador revalida o index.html a cada carga. Sem Cache-Control ele aplicava cache
    # heurístico (dias, pelo Last-Modified) e seguia apontando para o bundle de um deploy anterior.
    # Os assets têm hash no nome e continuam com cache longo (bloco abaixo).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxy para API (em produção, ajustar para URL do backend)
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /webhook {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    # App Android: APK, versao.json e página de download, publicados por scripts/app_publicar.sh
    # na pasta publicado/android/ (gitignored), montada aqui pelo docker-compose.yml. no-cache: a
    # cada publicação o arquivo muda com o mesmo nome.
    location = /android {
        absolute_redirect off;
        return 301 /android/;
    }
    location /android/ {
        add_header Cache-Control "no-cache";
        # Tipos explícitos: o mime.types de várias versões do nginx não tem o .apk, que saía como
        # text/plain e o navegador do celular podia salvar como texto.
        types {
            application/vnd.android.package-archive apk;
            text/html html;
            application/json json;
        }
        try_files $uri $uri/index.html =404;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
