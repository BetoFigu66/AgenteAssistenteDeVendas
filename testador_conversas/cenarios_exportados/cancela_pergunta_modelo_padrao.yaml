      Ótimo! Vou precisar de algumas informações para montar o orçamento.


      Qual modelo ou característica principal você procura?'
    ativo: false
    criado_por: proposta_claude
- ordem: 2
  mensagem_enviada: quanto custa mais ou menos?
  observacoes: 'PRECISA: dizer que o valor sai no orçamento e retomar a coleta | NÃO PODE: citar valor,
