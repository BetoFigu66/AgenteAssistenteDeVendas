nome: preco_e_prazo_na_mesma_mensagem
descricao: Duas regras de negócio na mesma mensagem (preço e prazo).
ativo: true
turnos:
- ordem: 1
  mensagem_enviada: oi, quanto custa e em quantos dias vocês entregam 3 relógios de ponto biométricos?
  observacoes: 'PRECISA: tratar as duas perguntas sem compromisso (valor via orçamento, prazo confirmado
    pela equipe) e seguir a coleta | NÃO PODE: citar valor, prazo, dias ou ''pronta entrega'' | exercita:
    regras ''nunca prometer prazo'' e ''preço só via orçamento'', REQ-002 multi-intenção'
  respostas_aceitas:
  - texto: 'Olá! 👋 Sou o assistente da Inforrel.


      Para te atender melhor, poderia me informar o CNPJ da sua empresa ou seu CPF?


      Ótimo! Vou precisar de algumas informações para montar o orçamento.


      Qual software de ponto vocês usam hoje? (ex.: Domínio, Alterdata, TOTVS, ou nenhum)


      O prazo depende do modelo escolhido e da disponibilidade em estoque. Nosso time comercial consegue
      confirmar um prazo preciso após definirmos o modelo. Posso te ajudar a escolher o modelo ideal?'
    ativo: false
    criado_por: proposta_claude
