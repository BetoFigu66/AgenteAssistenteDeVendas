# Pre-commit hooks do projeto.
# Setup (WSL):
#   source backend/venv/bin/activate
#   pip install -r requirements.txt
#   pre-commit install
#
# Rodar manualmente sobre tudo:
#   pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: qa-check
        name: QA Engineer - checks pre-commit
        entry: backend/venv/bin/python scripts/qa_check.py --escopo pre-commit --sem-cor
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
