# Pre-commit hooks do projeto.
#
# Setup — use o MESMO ambiente em que voce faz git commit (WSL ou PowerShell):
#   pip install -r requirements.txt   # raiz do repo (pre-commit, pytest, agentes)
#   pre-commit install
#
# Rodar manualmente sobre tudo:
#   pre-commit run --all-files
#
# Ver docs/comandos_uteis.md — secao "QA Engineer — checks automatizados e pre-commit"
# e secao "Skill de code review — sincronizacao com Windsurf" (hook sync-skill-windsurf).

repos:
  - repo: local
    hooks:
      - id: qa-check
        name: QA Engineer - checks pre-commit
        entry: bash scripts/run_qa_check_precommit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: sync-skill-windsurf
        name: Espelha .claude/skills para .windsurf/skills (Devin Desktop/Windsurf)
        entry: bash scripts/sync_skill_windsurf.sh
        language: system
        pass_filenames: false
        files: ^\.claude/skills/
        stages: [pre-commit]
